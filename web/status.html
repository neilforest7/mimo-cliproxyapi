<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiMo Provider</title>
  <style>/*__INLINE_CSS__*/</style>
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <div class="eyebrow"><span class="dot" id="healthDot"></span><span id="healthLabel">读取状态中</span></div>
        <h1>MiMo Provider</h1>
        <p class="subtitle">小米 MiMo 凭据、路由与模型能力 · 版本 <span id="version">__PLUGIN_VERSION__</span></p>
      </div>
      <div class="header-actions">
        <button class="btn" id="discoverAll" type="button">全部发现模型</button>
        <button class="btn" id="reload" type="button">刷新</button>
      </div>
    </header>

    <section class="card auth-card" id="authCard">
      <label for="keyInput">管理密钥（Management Key）</label>
      <div class="row">
        <input id="keyInput" type="password" placeholder="在管理面板里自动读取，或在这里填入" autocomplete="off">
        <button class="btn primary" id="saveKey" type="button">使用</button>
      </div>
      <p class="hint" id="authHint"></p>
    </section>

    <section class="grid" id="summary">
      <div class="card stat"><span class="stat-label">请求总数</span><strong id="totalRequests">–</strong></div>
      <div class="card stat"><span class="stat-label">失败数</span><strong id="totalErrors">–</strong></div>
      <div class="card stat"><span class="stat-label">Token Plan 集群</span><strong id="region">–</strong></div>
      <div class="card stat"><span class="stat-label">凭据数</span><strong id="credentialCount">–</strong></div>
    </section>

    <section class="card">
      <h2>新增 API Key</h2>
      <div class="row wrap">
        <input id="newKey" type="password" placeholder="sk-xxxxx（按量）或 tp-/ttp-xxxxx（Token Plan）" autocomplete="off">
        <input id="newLabel" type="text" placeholder="备注（可选）" autocomplete="off">
        <button class="btn primary" id="addKey" type="button">添加凭据</button>
      </div>
      <p class="hint" id="addHint">直接写入 CPA 的 auth 目录，无需重启：CPA 会自动加载新凭据。key 只落盘、不回显。</p>
    </section>

    <section class="card">
      <h2>凭据</h2>
      <table class="table" id="credentials">
        <thead>
          <tr><th>#</th><th>凭据</th><th>类型</th><th>目标</th><th>状态</th><th>请求 / 失败</th><th>最近</th><th>模型能力</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="hint" id="credentialsHint"></p>
    </section>

    <section class="card">
      <h2>模型目录</h2>
      <table class="table" id="catalog">
        <thead><tr><th>模型</th><th>上下文</th><th>最大输出</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="hint">目录可用插件配置的 <code>models</code> 字段覆盖。同名模型若被其它 provider 占用，host 会去重，这里仍按插件发布的内容显示。</p>
    </section>
  </main>

  <script>
    const BASE = "__MANAGEMENT_BASE__";
    const MGMT_ROOT = BASE.replace(/\/plugins\/[^/]+$/, "");
    const KEY_STORAGE = "mimo-provider-management-key";
    let key = "";

    function readPanelKey() {
      try {
        const parsed = JSON.parse(localStorage.getItem("cli-proxy-auth") || "null");
        const state = parsed && parsed.state ? parsed.state : parsed;
        const value = state && state.managementKey;
        if (typeof value === "string" && value.trim()) return value.trim();
      } catch (_) {}
      try {
        const stored = sessionStorage.getItem(KEY_STORAGE);
        if (stored) return stored.trim();
      } catch (_) {}
      return "";
    }

    async function api(path, options) {
      const opts = options || {};
      opts.headers = Object.assign({ Authorization: "Bearer " + key }, opts.headers || {});
      const response = await fetch(BASE + path, opts);
      const payload = await response.json().catch(function () { return { error: "响应不是 JSON" }; });
      if (!response.ok) throw new Error(payload.error || ("HTTP " + response.status));
      return payload;
    }

    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined) node.textContent = value;
      return node;
    }

    function text(id, value) {
      const node = document.getElementById(id);
      if (node) node.textContent = value;
    }

    function formatNumber(value) {
      return typeof value === "number" ? value.toLocaleString() : "–";
    }

    function kindLabel(kind) {
      if (kind === "token-plan") return "Token Plan";
      if (kind === "token-plan-team") return "Token Plan (团队)";
      if (kind === "pay-as-you-go") return "按量计费";
      if (kind === "unknown") return "未知前缀";
      return "未判定";
    }

    function kindClass(kind) {
      if (kind === "unknown") return "bad";
      if (kind) return "ok";
      return "idle";
    }

    function statusText(row) {
      if (row.disabled) return "已停用";
      if (row.unavailable) return "不可用";
      if (row.last_status >= 400) return "HTTP " + row.last_status;
      if (row.requests > 0) return "正常";
      return row.status || "待命";
    }

    function statusClass(row) {
      if (row.disabled || row.unavailable || row.last_status >= 400) return "bad";
      if (row.requests === 0) return "idle";
      return "ok";
    }

    function modelChips(row) {
      const models = row.model_support || {};
      const ids = Object.keys(models).sort();
      if (!ids.length) return element("span", "hint", "未发现");
      const wrap = element("div", "chips");
      ids.forEach(function (id) {
        const supported = models[id] === "supported";
        const chip = element("span", "chip " + (supported ? "ok" : "bad"), (supported ? "✓ " : "✗ ") + id);
        chip.title = supported ? "该凭据可用" : "上游返回不支持该模型";
        wrap.appendChild(chip);
      });
      return wrap;
    }

    function actionButton(label, handler, disabled, title) {
      const button = element("button", "btn small", label);
      button.type = "button";
      if (disabled) {
        button.disabled = true;
        button.title = title || "";
      } else {
        button.addEventListener("click", function () { handler(button); });
      }
      return button;
    }

    function credentialRow(row, index) {
      const tr = document.createElement("tr");
      if (row.stale) tr.className = "stale";
      tr.appendChild(element("td", "mono", String(index + 1)));

      const nameCell = document.createElement("td");
      nameCell.appendChild(element("div", "mono", row.name || row.id));
      if (row.label) nameCell.appendChild(element("div", "hint", row.label));
      nameCell.appendChild(element("div", "hint mono", row.id));
      tr.appendChild(nameCell);

      tr.appendChild(cellWithBadge(kindLabel(row.kind), kindClass(row.kind)));
      tr.appendChild(element("td", "mono small", row.url || "–"));
      tr.appendChild(cellWithBadge(statusText(row), statusClass(row)));
      tr.appendChild(element("td", "mono", formatNumber(row.requests) + " / " + formatNumber(row.errors)));
      tr.appendChild(element("td", "mono small", row.last_used ? row.last_used.replace("T", " ").replace("Z", "") : "–"));

      const modelsCell = document.createElement("td");
      modelsCell.appendChild(modelChips(row));
      tr.appendChild(modelsCell);

      const actionCell = document.createElement("td");
      actionCell.className = "actions";
      if (row.stale) {
        actionCell.appendChild(element("span", "badge bad", "文件已删除"));
      } else {
        actionCell.appendChild(actionButton("测速", function (button) { probe(row, button); }, !row.probe_available, "该凭据还没有运行时索引，重新加载插件后再试"));
        actionCell.appendChild(actionButton("发现模型", function (button) { discover(row, button); }, !row.probe_available, "该凭据还没有运行时索引，重新加载插件后再试"));
      }
      const canDelete = (row.name || "").toLowerCase().endsWith(".json");
      actionCell.appendChild(actionButton("删除", function (button) { removeCredential(row, button); }, !canDelete, "该行没有对应的 auth 文件"));
      tr.appendChild(actionCell);
      return tr;
    }

    function cellWithBadge(label, className) {
      const td = document.createElement("td");
      td.appendChild(element("span", "badge " + className, label));
      return td;
    }

    function catalogRow(model) {
      const tr = document.createElement("tr");
      tr.appendChild(element("td", "mono", model.id));
      tr.appendChild(element("td", "mono", formatNumber(model.context_length)));
      tr.appendChild(element("td", "mono", formatNumber(model.max_completion_tokens)));
      return tr;
    }

    function renderState(state) {
      text("version", state.version);
      text("totalRequests", formatNumber(state.totals.requests));
      text("totalErrors", formatNumber(state.totals.errors));
      text("region", state.region);
      text("credentialCount", String(state.credentials.length));

      const healthy = state.credentials.some(function (row) { return !row.disabled && !row.unavailable; });
      document.getElementById("healthDot").className = "dot " + (healthy ? "ok" : "warn");
      text("healthLabel", healthy ? "已就绪" : "没有可用凭据");

      const credentialsBody = document.querySelector("#credentials tbody");
      credentialsBody.textContent = "";
      state.credentials.forEach(function (row, index) {
        credentialsBody.appendChild(credentialRow(row, index));
      });
      const staleCount = state.credentials.filter(function (row) { return row.stale; }).length;
      text("credentialsHint", state.credentials_error
        ? "凭据列表读取失败：" + state.credentials_error
        : (staleCount
          ? "有 " + staleCount + " 行对应的 auth 文件已不存在（host 列表还在缓存），点「删除」清理。"
          : (state.credentials.length ? "模型能力来自真实请求：测速或发现模型会记录该凭据能用哪些模型，插件重载后重新发现。" : "还没有 MiMo 凭据，用上面的表单添加一个。")));

      const catalogBody = document.querySelector("#catalog tbody");
      catalogBody.textContent = "";
      state.catalog.forEach(function (model) {
        catalogBody.appendChild(catalogRow(model));
      });
    }

    async function probe(row, button) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "请求中";
      try {
        const result = await api("/probe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth_index: row.auth_index, auth_id: row.id }),
        });
        button.textContent = (result.ok ? "✅ " : "❌ ") + (result.latency_ms || 0) + "ms";
        if (result.error) button.title = result.error;
      } catch (err) {
        button.textContent = "失败";
        button.title = err.message;
      }
      setTimeout(function () { button.disabled = false; button.textContent = original; }, 6000);
      refresh();
    }

    async function discover(row, button) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "发现中";
      try {
        const result = await api("/discover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth_index: row.auth_index, auth_id: row.id }),
        });
        const entry = (result.credentials || [])[0] || {};
        const results = entry.results || [];
        const supported = results.filter(function (item) { return item.supported; }).length;
        button.textContent = "✅ " + supported + "/" + results.length;
        const rejected = results.filter(function (item) { return !item.supported && item.status; });
        if (rejected.length) button.title = "不支持：" + rejected.map(function (item) { return item.model; }).join(", ");
      } catch (err) {
        button.textContent = "失败";
        button.title = err.message;
      }
      setTimeout(function () { button.disabled = false; button.textContent = original; }, 8000);
      refresh();
    }

    async function discoverAll(button) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "发现中";
      try {
        const result = await api("/discover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ all: true }),
        });
        button.textContent = "✅ " + (result.credentials || []).length + " 条";
      } catch (err) {
        button.textContent = "失败";
        button.title = err.message;
      }
      setTimeout(function () { button.disabled = false; button.textContent = original; }, 8000);
      refresh();
    }

    async function removeCredential(row, button) {
      const fileName = row.name || "";
      if (!fileName.toLowerCase().endsWith(".json")) return;
      if (!window.confirm("删除凭据 " + fileName + "？会从 CPA 的 auth 目录移除该文件。")) return;
      button.disabled = true;
      button.textContent = "删除中";
      try {
        const response = await fetch(MGMT_ROOT + "/auth-files", {
          method: "DELETE",
          headers: { Authorization: "Bearer " + key, "Content-Type": "application/json" },
          body: JSON.stringify({ name: fileName }),
        });
        const payload = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(payload.error || ("HTTP " + response.status));
        // Clear the row even while the host list still caches the deleted credential.
        await api("/forget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: row.id }),
        });
        button.textContent = "已删除";
      } catch (err) {
        button.textContent = "删除失败";
        button.title = err.message;
        setTimeout(function () { button.disabled = false; button.textContent = "删除"; }, 6000);
      }
      refresh();
    }

    async function addCredential() {
      const input = document.getElementById("newKey");
      const value = input.value.trim();
      if (!value) {
        text("addHint", "先填入 API key。");
        return;
      }
      const button = document.getElementById("addKey");
      button.disabled = true;
      try {
        const result = await api("/credentials", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: value, label: document.getElementById("newLabel").value.trim() }),
        });
        input.value = "";
        document.getElementById("newLabel").value = "";
        text("addHint", "已写入 " + result.name + "（" + kindLabel(result.kind) + " → " + result.url + "）。");
      } catch (err) {
        text("addHint", "添加失败：" + err.message);
      }
      button.disabled = false;
      refresh();
    }

    async function refresh() {
      try {
        renderState(await api("/state"));
        text("authHint", "");
        document.getElementById("authCard").classList.add("hidden");
      } catch (err) {
        document.getElementById("authCard").classList.remove("hidden");
        text("authHint", "需要管理密钥才能读取状态（" + err.message + "）。");
      }
    }

    document.getElementById("saveKey").addEventListener("click", function () {
      const value = document.getElementById("keyInput").value.trim();
      if (!value) return;
      key = value;
      try { sessionStorage.setItem(KEY_STORAGE, value); } catch (_) {}
      refresh();
    });
    document.getElementById("addKey").addEventListener("click", addCredential);
    document.getElementById("discoverAll").addEventListener("click", function () { discoverAll(this); });
    document.getElementById("reload").addEventListener("click", refresh);

    key = readPanelKey();
    refresh();
  </script>
</body>
</html>
