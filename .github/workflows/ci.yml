name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      # The c-shared build is the release artifact; failing here means a tag would fail too.
      - name: Build shared library
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o /tmp/plugin.so .
      - name: Smoke test the C ABI
        run: python3 scripts/smoke.py
