name: release

# Tag v<version>, for example v0.1.0. The plugin store reads this repository's
# latest release, so the tag defines the version and the assets must follow the
# store layout:
#   <id>_<version>_<goos>_<goarch>.zip  plus  checksums.txt
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Must match the library file name, plugins.configs.<id>, and the registry id.
  PLUGIN_ID: mimo-cliproxyapi

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # c-shared needs a native toolchain, so each target uses its own runner.
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: dylib
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: dylib
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: so
          - runner: windows-2022
            goos: windows
            goarch: amd64
            extension: dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build shared library
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -buildmode=c-shared \
            -ldflags "-X main.pluginVersion=${GITHUB_REF_NAME#v}" \
            -o "dist/$PLUGIN_ID.${{ matrix.extension }}" .
          rm -f "dist/$PLUGIN_ID.h"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        with:
          name: lib-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.PLUGIN_ID }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        # v8.0.1
        with:
          path: libraries
      - name: Check tag format
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "tag must look like v0.1.0: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
      - name: Package archives and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_dir="$PWD/release"
          mkdir -p "$release_dir"
          for directory in libraries/lib-*; do
            platform="${directory#libraries/lib-}"
            goos="${platform%%-*}"
            goarch="${platform#*-}"
            library=$(find "$directory" -maxdepth 1 -type f \
              -name "$PLUGIN_ID.*" -print -quit)
            if [ -z "$library" ]; then
              echo "no library in $directory" >&2
              exit 1
            fi
            # The host needs the library at the archive root, no nested paths.
            staging=$(mktemp -d)
            archive="$release_dir/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip"
            cp "$library" "$staging/"
            (cd "$staging" && zip -q -X "$archive" "$(basename "$library")")
            rm -rf "$staging"
          done
          cd "$release_dir"
          sha256sum *.zip > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$PLUGIN_ID ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*.zip release/checksums.txt
